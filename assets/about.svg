<svg xmlns="http://www.w3.org/2000/svg" width="800" height="574" viewBox="0 0 800 574" role="img" aria-labelledby="title desc">
<title id="title">About and selected work</title>
<desc id="desc">I build production Web3 backends for DEX routing, swap execution, and multi-chain infrastructure. My focus is low-latency services, Solana/EVM execution flows, correctness, and observability. I own delivery from architecture through release and production support. Selected work: DEX router service with p95 solve latency under 50 ms, 27 DEX/launchpad integrations, Solana multi-asset vaults, cross-chain bridges and transaction orchestration, and 150+ smart contracts across multiple networks, including routers, tokens, staking, vesting, launchpads, DAOs and upgradeable systems.</desc>
